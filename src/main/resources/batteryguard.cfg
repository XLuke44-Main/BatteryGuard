# Battery Guard 1.0.2 configuration

general {

    # Turn Battery Guard on or off.
    B:enabled=true

    # Turn Battery Guard warnings on or off.
    B:warnings=true

    # Language used for Battery Guard messages.
    S:language=en

    # Warn players when the battery reaches this percentage.
    I:warningPercent=30

    # Show a critical warning when the battery reaches this percentage.
    I:criticalWarningPercent=20

    # Start shutting down the server when the battery reaches this percentage.
    I:shutdownPercent=10

    # Number of seconds to wait before shutting down the server.
    I:shutdownCountdownSeconds=30

    # How often Battery Guard checks the Windows battery, in seconds.
    I:batteryCheckIntervalSeconds=5

    # Cancel the shutdown countdown when mains power comes back
    B:cancelShutdownWhenCharging=true
}

players {
    # UUIDs of non-OP players who are allowed to use Battery Guard
    # read-only commands. Put one UUID on each line.
    S:playerUuids <
    >
}
